
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: local
    project: devops-assessment

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Node.js application metrics
  - job_name: application
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080

  # Linux host metrics
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # Docker container metrics
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
