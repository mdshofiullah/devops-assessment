
name: CI Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------
  # 1. Application linting and unit tests
  # --------------------------------------------------

  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage


  # --------------------------------------------------
  # 2. Docker build and security validation
  # --------------------------------------------------

  docker:
    name: Docker Build and Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Validate root Docker Compose
        run: docker compose config --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag devops-assessment:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: devops-assessment:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library


  # --------------------------------------------------
  # 3. Shell script validation
  # --------------------------------------------------

  shellcheck:
    name: Shell Script Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell scripts
        shell: bash
        run: |
          mapfile -t shell_files < <(
            find scripts -type f -name '*.sh' -print
          )

          if ((${#shell_files[@]} == 0)); then
            echo "No shell scripts found."
            exit 1
          fi

          shellcheck "${shell_files[@]}"

      - name: Validate Bash syntax
        shell: bash
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print)


  # --------------------------------------------------
  # 4. Terraform validation and mock tests
  # --------------------------------------------------

  terraform:
    name: Terraform Validation and Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Run Terraform mock tests
        working-directory: terraform
        run: terraform test


  # --------------------------------------------------
  # 5. Kubernetes and monitoring configuration
  # --------------------------------------------------

  configuration:
    name: Kubernetes and Monitoring Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Validate Kubernetes YAML against Kubernetes schemas.
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/k8s:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /manifests

      # Validate monitoring Docker Compose configuration.
      - name: Validate monitoring Docker Compose
        run: |
          docker compose \
            --env-file monitoring/.env.example \
            -f monitoring/docker-compose.yml \
            config --quiet

      # Validate Prometheus configuration.
      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint=promtool \
            -v "${GITHUB_WORKSPACE}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 \
            check config /etc/prometheus/prometheus.yml

      # Validate Prometheus alert rules.
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint=promtool \
            -v "${GITHUB_WORKSPACE}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.16.0 \
            check rules /etc/prometheus/alerts.yml

      # Validate all Grafana dashboard JSON files.
      - name: Validate Grafana dashboards
        run: |
          for dashboard in monitoring/grafana/dashboards/*.json; do
            echo "Validating ${dashboard}"
            python -m json.tool "${dashboard}" > /dev/null
          done


  # --------------------------------------------------
  # 6. Multi-architecture GHCR publishing
  # --------------------------------------------------

  publish:
    name: Build and Publish Docker Image

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))

    needs:
      - test
      - docker
      - shellcheck
      - terraform
      - configuration

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push multi-architecture Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
